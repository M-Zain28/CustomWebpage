<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Futuristic Hero Section</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #000000;
            overflow-x: hidden;
        }

        .hero-container {
            position: relative;
            width: 100%;
            height: 100vh;
            min-height: 600px;
            overflow: hidden;
        }

        #hero-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            pointer-events: none;
        }

        .hero-title {
            font-size: 3.5rem;
            font-weight: 900;
            color: #e30c14;
            text-shadow: 0 0 20px #e30c14, 0 0 40px #e30c14, 0 0 60px #e30c14;
            margin-bottom: 2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: glow 2s ease-in-out infinite alternate;
            max-width: 90%;
            line-height: 1.2;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 20px #e30c14, 0 0 40px #e30c14, 0 0 60px #e30c14;
            }
            to {
                text-shadow: 0 0 30px #e30c14, 0 0 60px #e30c14, 0 0 90px #e30c14;
            }
        }

        .hero-subtitle {
            font-size: 1.2rem;
            color: #ffffff;
            margin-bottom: 3rem;
            opacity: 0.8;
            max-width: 600px;
            line-height: 1.6;
        }

        .cta-button {
            padding: 15px 40px;
            background: linear-gradient(45deg, #e30c14, #a8040d);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(227, 12, 20, 0.3);
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(227, 12, 20, 0.6), 0 5px 15px rgba(227, 12, 20, 0.3);
            background: linear-gradient(45deg, #e50914, #e30c14);
        }

        .particle-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #e30c14, transparent);
            animation: scan 3s linear infinite;
            z-index: 2;
        }

        @keyframes scan {
            0% {
                top: 0;
                opacity: 1;
            }
            100% {
                top: 100%;
                opacity: 0;
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .hero-title {
                font-size: 2.5rem;
            }
            
            .hero-subtitle {
                font-size: 1rem;
                margin-bottom: 2rem;
            }
            
            .cta-button {
                padding: 12px 30px;
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            .hero-title {
                font-size: 2rem;
            }
            
            .hero-subtitle {
                font-size: 0.9rem;
                padding: 0 20px;
            }
        }

        /* Loading screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid #333;
            border-top: 3px solid #e30c14;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading-screen" id="loading-screen">
        <div class="loader"></div>
    </div>

    <div class="hero-container">
        <canvas id="hero-canvas"></canvas>
        <div class="scan-line"></div>
        <div class="hero-overlay">
            <h1 class="hero-title">Empowering Innovation, Driving Digital Growth</h1>
            <p class="hero-subtitle">Experience the future of technology with our cutting-edge AI solutions</p>
            <button class="cta-button" onclick="window.location.href='#solutions'">Explore Solutions</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="hero-scene.js"></script>
</body>
</html>
